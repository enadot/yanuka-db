[workspace]
resolver = "2"
members = [
  "crates/yanuka-db",
  "crates/yanuka-search",
  "crates/yanuka-sync-proto",
  "crates/yanuka-sync-server",
  "apps/desktop/src-tauri",
]

# The Tauri shell links against the system webview, which is not present on
# every development machine (and notably not on the Linux CI runner used for
# the fast checks). `yanuka-db` and `yanuka-search` deliberately have no Tauri
# dependency so they can be built and tested anywhere:
#
#     cargo test -p yanuka-db -p yanuka-search
#
# Building the whole workspace requires libwebkit2gtk-4.1-dev on Linux, or
# Windows/macOS. See docs/ARCHITECTURE.md.

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.dev]
# Debug builds of this workspace are dominated by the dependency tree, not by
# our own code: `windows`, `tauri` and a bundled SQLite compile to hundreds of
# megabytes of debug information that nobody ever steps through. On a machine
# with a modest paging file that is not a slow build, it is a *failed* one —
# rustc dies with "the paging file is too small for this operation to complete"
# (os error 1455) partway through, and leaves behind corrupt .rlib metadata
# that poisons the next attempt too.
#
# Line tables are kept for the workspace crates, which is what a readable
# backtrace actually needs. Full `debug = 2` is a `--profile` flag away on the
# rare occasion someone wants to step into a dependency.
debug = 1

[profile.dev.package."*"]
# Dependencies get no debug information at all. You do not set a breakpoint
# inside the `windows` crate.
debug = false

[profile.release]
# The installer ships to machines that are frequently offline and may be
# modest; a smaller, faster binary matters more here than build time.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
