[package]
name = "yanuka-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Windows desktop shell for the contacts database"

[lib]
name = "yanuka_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
yanuka-db = { path = "../../../crates/yanuka-db" }
yanuka-search = { path = "../../../crates/yanuka-search" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# Used by `tauri dev` to enable the custom protocol on desktop.
custom-protocol = ["tauri/custom-protocol"]
