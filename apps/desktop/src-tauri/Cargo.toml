[package]
name = "yanuka-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Windows desktop shell for the contacts database"

[lib]
name = "yanuka_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
yanuka-db = { path = "../../../crates/yanuka-db" }
yanuka-search = { path = "../../../crates/yanuka-search" }
tauri = { version = "2", features = [] }
yanuka-sync-client = { path = "../../../crates/yanuka-sync-client" }
# Only `time`, and only for the background sync loop's sleep. Tauri's async
# runtime is tokio already, so this pulls nothing new into the binary; parking a
# blocking thread for up to half an hour instead would be a thread spent to
# avoid one line of manifest.
tokio = { version = "1", default-features = false, features = ["time"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# Used by `tauri dev` to enable the custom protocol on desktop.
custom-protocol = ["tauri/custom-protocol"]
