name: Release

# Publishes the Windows installer to a GitHub Release — the permanent,
# findable home for installers, unlike CI artifacts which expire after 30
# days. Two ways in, same result (docs/VERSIONING.md):
#
#   - push a version tag (v0.2.0), or
#   - run this workflow manually from the Actions page; it then creates the
#     tag itself from the declared version, at the chosen branch's head.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    name: windows · installer → GitHub Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The single source of truth for the number is tauri.conf.json. A tag
      # that disagrees with it would produce an installer whose filename lies
      # about its contents — refuse early.
      - name: Resolve and verify the version
        id: version
        shell: bash
        run: |
          declared="$(node -p "JSON.parse(require('fs').readFileSync('apps/desktop/src-tauri/tauri.conf.json','utf8')).version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not match tauri.conf.json version $declared" >&2
            exit 1
          fi
          echo "version=$declared" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - run: pnpm install --frozen-lockfile

      - name: Fetch the semantic model
        uses: ./.github/actions/semantic-model

      - run: pnpm --filter @yanuka/desktop tauri build

      # The sync server for Windows rides along (ADR-039): the same
      # toolchain and cache, a few seconds more.
      - run: cargo build --release -p yanuka-server

      - name: Collect the installer and the server
        shell: bash
        run: |
          setup=$(ls target/release/bundle/nsis/*-setup.exe | head -n 1)
          if [ -z "$setup" ]; then
            echo "no NSIS installer was produced" >&2
            exit 1
          fi
          cp "$setup" "OtzarShlomo_${{ steps.version.outputs.version }}_x64-setup.exe"
          cp target/release/yanuka-server.exe "yanuka-server_${{ steps.version.outputs.version }}_windows-x64.exe"

      - name: Extract release notes from the changelog
        shell: bash
        run: node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" > release-notes.md

      # On a tag push the tag already exists and --target is ignored; on a
      # manual run the release creates the tag at the built commit.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            "OtzarShlomo_${VERSION}_x64-setup.exe" \
            "yanuka-server_${VERSION}_windows-x64.exe" \
            --target "$GITHUB_SHA" \
            --title "אוצר שלמה $VERSION" \
            --notes-file release-notes.md

  # The phone build (ADR-040), attached to the same release.
  android:
    name: android · OtzarShlomo.apk → the same release
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/android-apk
        id: apk
        with:
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.apk }}
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('apps/desktop/src-tauri/tauri.conf.json','utf8')).version")"
          cp "$APK" "OtzarShlomo_${version}_android.apk"
          gh release upload "v$version" "OtzarShlomo_${version}_android.apk" --clobber

  # The server for a Linux box (a NAS, a Raspberry Pi 4/5 in 64-bit mode
  # is aarch64 — built from source there; see server/README.md), attached
  # to the release the job above created.
  server-linux:
    name: linux · yanuka-server → the same release
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p yanuka-server
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('apps/desktop/src-tauri/tauri.conf.json','utf8')).version")"
          cp target/release/yanuka-server "yanuka-server_${version}_linux-x64"
          gh release upload "v$version" "yanuka-server_${version}_linux-x64" --clobber
