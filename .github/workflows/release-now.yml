name: Release now

# Temporary bootstrap: GitHub only registers a workflow_dispatch workflow
# once it exists on the default branch, so the very first release cannot be
# cut from the Actions page. This file triggers the release from a push to
# the development branch instead, and is deleted once v0.2.0 is published.

on:
  push:
    branches: ['claude/shadcn-ui-install-issue-jwfa9n']

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/release.yml
