[package]
name = "yanuka-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local SQLite storage, migrations and search execution for the contacts database"

[dependencies]
yanuka-search = { path = "../yanuka-search" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# `bundled` compiles SQLite into the binary rather than linking whatever the
# host happens to ship. That is what guarantees FTS5, the trigram tokenizer and
# STRICT tables are present on a user's Windows machine, and it keeps the
# desktop's SQLite version pinned to what the tests ran against.
#
# Swapping to `bundled-sqlcipher-vendored-openssl` is the only change encryption
# at rest requires — every connection is already opened through one function.
# See docs/SECURITY.md.
rusqlite = { version = "0.37", features = ["bundled", "functions", "backup", "serde_json"] }
ulid = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }

# Semantic search (ADR-036): ONNX Runtime executes the bundled sentence
# embedding model; `tokenizers` is Hugging Face's pure-Rust tokenizer. Both
# sit behind the `semantic` feature so the default `cargo test` stays light —
# the desktop build enables it, mirroring how `sqlcipher` is wired.
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "download-binaries", "tls-rustls", "copy-dylibs", "api-27"] }
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["onig"] }

[dev-dependencies]
tempfile = "3"

[features]
default = []
# Not enabled yet; the deferral and its cost are recorded in DECISIONS.md.
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]
semantic = ["dep:ort", "dep:tokenizers"]
