[package]
name = "yanuka-sync-proto"
version.workspace = true
edition.workspace = true
license.workspace = true

# Deliberately free of any database dependency. The server links this crate for
# the wire types and must not, as a consequence, end up linking rusqlite — and
# the sealing below has to be usable from a device that has no server.

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
