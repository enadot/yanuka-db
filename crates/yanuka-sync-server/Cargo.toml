[package]
name = "yanuka-sync-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
yanuka-sync-proto = { path = "../yanuka-sync-proto" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
subtle = "2"

# Runtime-checked queries rather than the `query!` macros. Two reasons, and the
# second is the binding one: the macros need a live database at *compile* time,
# which would make the server unbuildable in CI; and the `macros` feature pulls
# in every sqlx driver including its SQLite one, whose `libsqlite3-sys` version
# collides with the one rusqlite links for the desktop. Postgres only.
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio", "tls-rustls-ring", "postgres", "chrono",
] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

[dev-dependencies]
# `oneshot` drives the router directly, so the tests exercise the real handlers,
# the real extractors and the real database without binding a port.
tower = { version = "0.5", features = ["util"] }
